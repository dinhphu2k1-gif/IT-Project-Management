apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: ${CLICKHOUSE_USER}
      defaultDatabase: rtdp
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
