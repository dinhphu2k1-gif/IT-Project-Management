# Kafka producer dùng bởi GoldenGate DAA.
# Kafka trong docker-compose quảng bá cổng EXTERNAL là localhost:9092 cho tiến trình chạy trên máy host.
# Nếu GoldenGate chạy trong container cùng mạng docker "rtdp_default" thì dùng kafka:29092.
bootstrap.servers=localhost:9092

acks=1
linger.ms=0
batch.size=16384
compression.type=none
reconnect.backoff.ms=1000

key.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
