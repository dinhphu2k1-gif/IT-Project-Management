name: rtdp

# Demo RTDP: Oracle (core banking giả lập) -> GoldenGate Extract -> GoldenGate DAA (Kafka Handler)
#            -> Kafka -> ClickHouse -> Grafana
# GoldenGate KHÔNG nằm trong file này: cài và cấu hình theo thư mục goldengate/ và README.md.
# Mật khẩu và địa chỉ đổi trong file .env (xem .env.example).
# Ngưỡng cảnh báo nằm trong ClickHouse: scripts/set-threshold.sh

services:
  oracle:
    image: gvenzl/oracle-free:23
    container_name: rtdp-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-oracle}
      CORE_PASSWORD: ${CORE_PASSWORD:-core}
      GGADMIN_PASSWORD: ${GGADMIN_PASSWORD:-ggadmin}
      TZ: UTC
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/setup:/container-entrypoint-initdb.d:ro
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.1
    container_name: rtdp-kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: cho các container (ClickHouse). EXTERNAL: cho GoldenGate DAA chạy trên máy host.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports:
      - "9092:9092"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # Tạo sẵn topic (1 partition để giữ đúng thứ tự thay đổi), chạy xong thì thoát
  kafka-init:
    image: apache/kafka:3.8.1
    container_name: rtdp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in CORE.BRANCH CORE.CUSTOMER CORE.ACCOUNT CORE.TXN; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic $$t --partitions 1 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: rtdp-clickhouse
    environment:
      CLICKHOUSE_DB: rtdp
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-rtdp}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-rtdp}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 1536m
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: rtdp-grafana
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.5.1
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rtdp.json
      GF_USERS_DEFAULT_LANGUAGE: en-US
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Dùng trong provisioning datasource
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-rtdp}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-rtdp}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 256m
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oracle-data:
  clickhouse-data:
  grafana-data:
